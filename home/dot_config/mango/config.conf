# mango config. Anything not listed falls back to mango's defaults;
# the full stock reference is /etc/mango/config.conf.
# Keys mirror home/.chezmoiscripts/run_onchange_after_40-gnome-settings.sh.tmpl.

# ── Look ─────────────────────────────────────────────────────────────────────
border_px=2
border_radius=0
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0

root_color=0x201b14ff
border_color=0x444444ff
focus_color=0xc9b890ff
urgent_color=0xad401fff
maximized_screen_color=0x89aa61ff
drop_color=0x8FBA7C55

# effects stay off
blur=0
shadows=0
dim_enable=0

# ── Animations ───────────────────────────────────────────────────────────────
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
tag_animation_direction=1
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# ── Windows and focus ────────────────────────────────────────────────────────
# focus follows the mouse (GNOME: sloppy) and the pointer follows keyboard focus
sloppy_focus=1
warp_cursor=1
focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0
focus_direction_only_zone_overlap=1
enable_hotarea=0
enable_floating_snap=0
no_border_when_single=0
float_full_to_top=0
drag_tile_to_tile=1
drag_tile_small=1
cursor_size=24

# ── Tags (GNOME workspaces) ──────────────────────────────────────────────────
# tile layout only: master on the left
tag_num=9
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# ── Input ────────────────────────────────────────────────────────────────────
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# trackpad and mouse settings need a relogin to apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
mouse_natural_scrolling=0

# ── Keys ─────────────────────────────────────────────────────────────────────
# bind=MODS,key,action,args   (key names: `wev`; bindl also works while locked)

# apps
bind=SUPER,Return,spawn_shell,exec ${TERMINAL:-ghostty}
bind=SUPER,r,spawn,vicinae toggle
bind=SUPER,v,spawn,vicinae vicinae://launch/clipboard/history
bind=CTRL+ALT,e,spawn,vicinae vicinae://launch/core/search-emojis
bind=SUPER,b,spawn_shell,exec ${BROWSER:-helium}
bind=SUPER,e,spawn_shell,xdg-open $HOME
bind=SUPER,comma,spawn,gnome-control-center
bind=ALT,Print,spawn_shell,$HOME/.local/bin/satty-region

# window
bind=SUPER,q,killclient
bind=SUPER,f,togglemaximizescreen
bind=SUPER,h,minimized
bind=SUPER+SHIFT,h,restore_minimized
# no GNOME equivalent: tiling needs a way to float a window
bind=SUPER+SHIFT,f,togglefloating

# focus: arrows like the directional-focus extension, Tab/Alt+Tab switcher
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,Tab,switcher,next
bind=SUPER+SHIFT,Tab,switcher,prev
bind=ALT,Tab,switcher,next
bind=ALT+SHIFT,Tab,switcher,prev

# workspace: switch / move window
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER+ALT,Left,viewtoleft,0
bind=SUPER+ALT,Right,viewtoright,0
bind=SUPER+SHIFT,Page_Up,tagtoleft,0
bind=SUPER+SHIFT,Page_Down,tagtoright,0
bind=SUPER+SHIFT+ALT,Left,tagtoleft,0
bind=SUPER+SHIFT+ALT,Right,tagtoright,0

# move window to another monitor
bind=SUPER+SHIFT,Left,tagmon,left
bind=SUPER+SHIFT,Right,tagmon,right
bind=SUPER+SHIFT,Up,tagmon,up
bind=SUPER+SHIFT,Down,tagmon,down

# media keys
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 6%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 6%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -n set 5%-
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# GNOME's logout shortcut (quits at once, no confirm dialog)
bind=CTRL+ALT,Delete,quit

# mouse: Super+drag moves, Super+middle/right drag resizes
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,moveresize,curresize
mousebind=SUPER,btn_right,moveresize,curresize

# ── Autostart ────────────────────────────────────────────────────────────────
# Nothing to start. vicinae runs as the enabled systemd user unit vicinae.service
# (WantedBy=graphical-session.target), which mango pulls in via mango-session.target.
# If it is ever not running after login, add:  exec_once=vicinae server
