# Declarative package list. Editing this file re-triggers the matching
# run_onchange_ scripts on the next `chezmoi apply`.
# Note: removing an entry does NOT uninstall it -- move it to `absent` instead.
packages:
  fedora:
    copr:
      - atim/starship
      - dejan/lazygit
      - imput/helium
      - quadratech188/vicinae
      - scottames/ghostty
      - zeno/scrcpy
    repos:
      docker-ce: https://download.docker.com/linux/fedora/docker-ce.repo
    # repos that ship as a release rpm: <rpm>: <--repofrompath spec> (bootstrap, skipped once installed)
    release_rpms:
      terra-release: terra,https://repos.fyralabs.com/terra$releasever
    # repo files written verbatim to /etc/yum.repos.d/<name>.repo
    repofiles:
      netbird: |
        [NetBird]
        name=NetBird
        baseurl=https://pkgs.netbird.io/yum/
        enabled=1
        gpgcheck=1
        gpgkey=https://pkgs.netbird.io/yum/repodata/repomd.xml.key
        repo_gpgcheck=1
      vscode: |
        [code]
        name=Visual Studio Code
        baseurl=https://packages.microsoft.com/yumrepos/vscode
        enabled=1
        autorefresh=1
        type=rpm-md
        gpgcheck=1
        gpgkey=https://packages.microsoft.com/keys/microsoft.asc
    dnf:
      # shell & terminal
      - zsh
      - ghostty
      - atuin
      - eza
      - zoxide
      - starship
      - fastfetch
      # dev
      - neovim
      - gh
      - glab
      - direnv
      - lazygit
      - chezmoi
      - code
      # docker
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      # desktop
      - helium-bin
      - vicinae
      - netbird
      - netbird-ui
      - scrcpy
      # mango session: compositor, screenshots, clipboard, media/volume/brightness keys
      - mangowm
      - quickshell
      # portals (mango-portals.conf: wlr for screencast/screenshot, gtk for the rest) and a polkit agent
      - xdg-desktop-portal-wlr
      - xdg-desktop-portal-gtk
      - mate-polkit
      - grim
      - slurp
      - wl-clipboard
      - wireplumber
      - brightnessctl
      - playerctl
      # work: Phase CLI, installed straight from its release rpm (x86_64).
      # No repo exists, so bump the version in the URL to upgrade.
      - https://github.com/phasehq/cli/releases/download/v2.3.3/phase_cli_2.3.3_linux_amd64.rpm
    absent:
      - kitty
      - firefox
      - firefox-langpacks
  flatpak:
    - com.mattjakeman.ExtensionManager
    - com.stremio.Stremio
    - org.gnome.seahorse.Application
    - page.tesk.Refine
