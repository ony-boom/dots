window_padding_width 8
hide_window_decorations titlebar-only
window_border_width 1px

font_size 14

font_family      family="Hasklug Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto


# open new windows (panes) and tabs in the cwd of the current window
map kitty_mod+enter launch --type=window --cwd=current
map kitty_mod+t     launch --type=tab --cwd=current
