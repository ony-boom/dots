window_padding_width 8
hide_window_decorations titlebar-only
window_border_width 1px

font_size 14

font_family      family="Hasklug Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto


# panes: free-form splits, plus a stack layout used to zoom one pane
enabled_layouts splits,stack

# open new panes and tabs in the cwd of the current pane
# kitty_mod+enter splits along the longer side; ctrl+alt+\ and ctrl+alt+- pick a side
map kitty_mod+enter    launch --type=window --cwd=current --location=split
map ctrl+alt+backslash launch --type=window --cwd=current --location=vsplit
map ctrl+alt+minus     launch --type=window --cwd=current --location=hsplit
map kitty_mod+t        launch --type=tab --cwd=current

# move between panes vim-style, zoom the current one
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right
map ctrl+alt+z toggle_layout stack

# jump to tab by the number shown in the tab bar
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# tab bar (top): plain text on a slightly raised bar, active tab in bold
tab_bar_edge            top
tab_bar_style           separator
tab_separator           " │ "
tab_bar_align           left
tab_bar_margin_width    12
tab_bar_margin_height   5 5
tab_title_template      "{bell_symbol}{activity_symbol}{index} {title}"
tab_activity_symbol     "● "
bell_on_tab             "󰂚 "
tab_title_max_length    30
active_tab_font_style   bold
inactive_tab_font_style normal
