# Declarative zsh plugins, fetched by chezmoi on `chezmoi apply` (no runtime
# plugin manager). Tarballs, not clones: no .git dir, refreshed weekly.
# Add a plugin: new block here + a `source` line in dot_config/zsh/dot_zshrc.

[".local/share/zsh/plugins/zsh-vi-mode"]
    type = "archive"
    url = "https://github.com/jeffreytse/zsh-vi-mode/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".local/share/zsh/plugins/fast-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zdharma-continuum/fast-syntax-highlighting/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
